#cloud-config
# QuietBook Droplet base provisioning.
# Installs Docker, creates a 2 GB swap file, and clones the release repo.
# Secrets are NEVER placed here; they are added manually into a root-owned
# /opt/quietbook/ops/digitalocean/.env.production (mode 600) after boot.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - sqlite3
  - unattended-upgrades

write_files:
  - path: /etc/quietbook-cloud-init.log
    content: "QuietBook cloud-init started\n"
    permissions: "0644"

runcmd:
  # --- Docker engine + compose plugin ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c '. /etc/os-release && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  # --- 2 GB emergency swap ---
  - bash -c 'if [ ! -f /swapfile ]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab; fi'
  # --- Clone the release repo ---
  - bash -c 'if [ ! -d /opt/quietbook/.git ]; then git clone https://github.com/karagozemin/QuietBook.git /opt/quietbook && git -C /opt/quietbook checkout main; fi'
  # --- Marker so we can detect completion over SSH ---
  - bash -c 'echo "QuietBook cloud-init finished at $(date -u +%FT%TZ)" >> /etc/quietbook-cloud-init.log'
  - touch /etc/quietbook-cloud-init.done
